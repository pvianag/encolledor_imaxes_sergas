name: Release

# Builds Linux / Windows / macOS binaries and attaches them to the GitHub Release.
# Triggers:
#   - push of a version tag (v1.2.3) → creates/updates the release with assets
#   - publishing a Release in the GitHub UI → builds and uploads assets to that release
#   - manual run from the Actions tab
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.0.0). Leave empty to only upload workflow artifacts."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: sergas-zip-shrinker
  REPO: pvianag/encolledor_imaxes_sergas

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: sergas-zip-shrinker-linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sergas-zip-shrinker-windows-x86_64
            ext: ".exe"
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: sergas-zip-shrinker-macos-x86_64
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: sergas-zip-shrinker-macos-aarch64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --bin sergas-zip-shrinker --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${APP_NAME}${{ matrix.ext }}"
          DST="dist/${{ matrix.artifact }}${{ matrix.ext }}"
          cp "$SRC" "$DST"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            strip "$DST" || true
            chmod +x "$DST"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}${{ matrix.ext }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}${{ matrix.ext }}" > "${{ matrix.artifact }}.sha256"
          fi
          ls -lh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}${{ matrix.ext }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  publish:
    name: Attach assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ -z "${TAG}" ]]; then
            echo "No release tag — will only keep workflow artifacts."
          else
            echo "Publishing assets for tag: ${TAG}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          set -euo pipefail
          mkdir -p out
          find release-assets -type f \( \
              -name 'sergas-zip-shrinker-linux-x86_64' -o \
              -name 'sergas-zip-shrinker-windows-x86_64.exe' -o \
              -name 'sergas-zip-shrinker-macos-x86_64' -o \
              -name 'sergas-zip-shrinker-macos-aarch64' -o \
              -name '*.sha256' \
            \) -exec cp -v {} out/ \;
          ls -lah out
          test -f out/sergas-zip-shrinker-linux-x86_64
          test -f out/sergas-zip-shrinker-windows-x86_64.exe
          test -f out/sergas-zip-shrinker-macos-x86_64
          test -f out/sergas-zip-shrinker-macos-aarch64

      - name: Create / update GitHub Release with assets
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Sergas ZIP Shrinker ${{ steps.meta.outputs.tag }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: out/*
          fail_on_unmatched_files: true
          body: |
            ## Sergas ZIP Shrinker ${{ steps.meta.outputs.tag }}

            Descarga **só o executábel** da túa plataforma (sen instalador).

            | Plataforma | Descarga directa |
            |---|---|
            | Linux x86_64 | [sergas-zip-shrinker-linux-x86_64](https://github.com/${{ env.REPO }}/releases/download/${{ steps.meta.outputs.tag }}/sergas-zip-shrinker-linux-x86_64) |
            | Windows x86_64 | [sergas-zip-shrinker-windows-x86_64.exe](https://github.com/${{ env.REPO }}/releases/download/${{ steps.meta.outputs.tag }}/sergas-zip-shrinker-windows-x86_64.exe) |
            | macOS Intel | [sergas-zip-shrinker-macos-x86_64](https://github.com/${{ env.REPO }}/releases/download/${{ steps.meta.outputs.tag }}/sergas-zip-shrinker-macos-x86_64) |
            | macOS Apple Silicon | [sergas-zip-shrinker-macos-aarch64](https://github.com/${{ env.REPO }}/releases/download/${{ steps.meta.outputs.tag }}/sergas-zip-shrinker-macos-aarch64) |

            Última release: https://github.com/${{ env.REPO }}/releases/latest

            Ferramenta non oficial · GPL-3.0-or-later
