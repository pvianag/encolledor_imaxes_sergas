name: Release

# Builds the same artifacts as local `./scripts/package-all.sh` (plus macOS):
#   - Linux x86_64:  cargo build --release --locked  (host)
#   - Windows x86_64: cargo zigbuild --target x86_64-pc-windows-gnu  (Zig 0.13)
#   - macOS:          native runners (Apple SDK; not cross-built on Linux)
#
# Triggers: tag v*, published Release, or manual workflow_dispatch.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.0.0-alpha). Empty = artifacts only."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: sergas-zip-shrinker
  REPO: pvianag/encolledor_imaxes_sergas
  ZIG_VERSION: "0.13.0"
  CARGO_ZIGBUILD_VERSION: "0.23.0"

jobs:
  # --- Same toolchain path as the developer machine (package-all.sh) ---
  build-linux-windows:
    name: Build Linux + Windows (zigbuild)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux GUI / link deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config \
            curl xz-utils

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-gnu

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            -o /tmp/zig.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
          zig version

      - name: Install cargo-zigbuild ${{ env.CARGO_ZIGBUILD_VERSION }}
        run: cargo install cargo-zigbuild --locked --version "${CARGO_ZIGBUILD_VERSION}"

      - name: Show toolchain (must match local)
        run: |
          rustc --version
          cargo --version
          zig version
          cargo zigbuild --version
          echo "CARGO_PKG_VERSION=$(grep -m1 '^version' Cargo.toml)"

      - name: Build Linux x86_64 (host, same as package-all.sh)
        run: cargo build --release --locked --bin sergas-zip-shrinker

      - name: Build Windows x86_64 (zigbuild gnu, same as package-all.sh)
        run: |
          cargo zigbuild --release --locked --bin sergas-zip-shrinker \
            --target x86_64-pc-windows-gnu

      - name: Stage Linux + Windows artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -f target/release/${APP_NAME} dist/sergas-zip-shrinker-linux-x86_64
          # profile.release already strips; strip again is a no-op / safe
          strip dist/sergas-zip-shrinker-linux-x86_64 || true
          chmod +x dist/sergas-zip-shrinker-linux-x86_64
          cp -f target/x86_64-pc-windows-gnu/release/${APP_NAME}.exe \
            dist/sergas-zip-shrinker-windows-x86_64.exe
          (
            cd dist
            sha256sum sergas-zip-shrinker-linux-x86_64 \
              sergas-zip-shrinker-windows-x86_64.exe > SHA256SUMS.linux-windows
            ls -lh
            file sergas-zip-shrinker-linux-x86_64 sergas-zip-shrinker-windows-x86_64.exe || true
          )

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sergas-zip-shrinker-linux-x86_64
          path: |
            dist/sergas-zip-shrinker-linux-x86_64
            dist/SHA256SUMS.linux-windows
          if-no-files-found: error

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sergas-zip-shrinker-windows-x86_64
          path: |
            dist/sergas-zip-shrinker-windows-x86_64.exe
            dist/SHA256SUMS.linux-windows
          if-no-files-found: error

  # --- macOS: native Apple SDK (cannot be reproduced on Linux) ---
  build-macos:
    name: Build macOS (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was retired; macos-15-intel is GitHub's x86_64 replacement
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: sergas-zip-shrinker-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: sergas-zip-shrinker-macos-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Build release
        run: |
          cargo build --release --locked --bin sergas-zip-shrinker \
            --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${APP_NAME}"
          DST="dist/${{ matrix.artifact }}"
          cp -f "$SRC" "$DST"
          strip "$DST" || true
          chmod +x "$DST"
          (
            cd dist
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
            ls -lh
            file "${{ matrix.artifact }}" || true
          )

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  publish:
    name: Attach assets to GitHub Release
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: '${TAG:-<none>}'"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          set -euo pipefail
          mkdir -p out
          find release-assets -type f \( \
              -name 'sergas-zip-shrinker-linux-x86_64' -o \
              -name 'sergas-zip-shrinker-windows-x86_64.exe' -o \
              -name 'sergas-zip-shrinker-macos-x86_64' -o \
              -name 'sergas-zip-shrinker-macos-aarch64' -o \
              -name '*.sha256' -o \
              -name 'SHA256SUMS*' \
            \) -exec cp -v {} out/ \;
          ls -lah out
          test -f out/sergas-zip-shrinker-linux-x86_64
          test -f out/sergas-zip-shrinker-windows-x86_64.exe
          test -f out/sergas-zip-shrinker-macos-x86_64
          test -f out/sergas-zip-shrinker-macos-aarch64
          (
            cd out
            sha256sum sergas-zip-shrinker-linux-x86_64 \
              sergas-zip-shrinker-windows-x86_64.exe \
              sergas-zip-shrinker-macos-x86_64 \
              sergas-zip-shrinker-macos-aarch64 > SHA256SUMS
          )

      - name: Create / update GitHub Release with assets
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Sergas ZIP Shrinker ${{ steps.meta.outputs.tag }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: out/*
          fail_on_unmatched_files: true
          body: |
            ## Sergas ZIP Shrinker ${{ steps.meta.outputs.tag }}

            Binarios xerados co **mesmo toolchain** que o desenvolvemento local:
            - Rust **1.97.1** + `Cargo.lock`
            - Linux: `cargo build --release --locked`
            - Windows: `cargo zigbuild` + Zig **0.13** → `x86_64-pc-windows-gnu`
            - macOS: runners nativos Apple (Intel + Apple Silicon)

            | Plataforma | Descarga |
            |---|---|
            | Linux x86_64 | [sergas-zip-shrinker-linux-x86_64](https://github.com/${{ env.REPO }}/releases/download/${{ steps.meta.outputs.tag }}/sergas-zip-shrinker-linux-x86_64) |
            | Windows x86_64 | [sergas-zip-shrinker-windows-x86_64.exe](https://github.com/${{ env.REPO }}/releases/download/${{ steps.meta.outputs.tag }}/sergas-zip-shrinker-windows-x86_64.exe) |
            | macOS Intel | [sergas-zip-shrinker-macos-x86_64](https://github.com/${{ env.REPO }}/releases/download/${{ steps.meta.outputs.tag }}/sergas-zip-shrinker-macos-x86_64) |
            | macOS Apple Silicon | [sergas-zip-shrinker-macos-aarch64](https://github.com/${{ env.REPO }}/releases/download/${{ steps.meta.outputs.tag }}/sergas-zip-shrinker-macos-aarch64) |

            https://github.com/${{ env.REPO }}/releases/latest
