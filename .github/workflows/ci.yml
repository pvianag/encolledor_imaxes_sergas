name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build-linux:
    name: Test + Linux build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Test
        run: cargo test --locked

      - name: Build Linux
        run: cargo build --release --locked --bin sergas-zip-shrinker

  build-windows:
    name: Windows MSVC build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc

      - name: Build Windows
        shell: pwsh
        run: cargo build --release --locked --bin sergas-zip-shrinker --target x86_64-pc-windows-msvc
